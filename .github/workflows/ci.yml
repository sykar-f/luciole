name: MVP
on: [push, pull_request]
jobs:
  verify:
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          # tests/forge-build.test.ts imports the last commits of this checkout.
          fetch-depth: 0
      - uses: oven-sh/setup-bun@v2.2.0
        with:
          bun-version: 1.4.2
      - uses: actions/setup-python@v7.0.0
        with:
          python-version: "3.14.7"
      - run: bun install --frozen-lockfile
      - run: pip install -r scripts/requirements-pty.txt
      - run: bun run probes
      - run: bun run verify
      - run: python3 scripts/pty-smoke.py
      - run: python3 scripts/pty-dev.py
      - run: bun scripts/clean-install.ts
      # The compiled Client in Debian (glibc) and Alpine (musl) containers without Bun.
      - if: runner.os == 'Linux'
        run: bun scripts/linux-client.ts
  # The sandbox mode on Linux (docs/EMBEDDING.md, step 8), in containers, one per
  # mechanism (namespaces, bubblewrap, Landlock alone), plus the launcher's own tests and
  # a check that the committed launcher is what its sources build.
  linux-sandbox:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: oven-sh/setup-bun@v2.2.0
        with:
          bun-version: 1.4.2
      - run: bun install --frozen-lockfile
      - run: bun scripts/build-sandbox.ts --check --arch x64
      - run: bun scripts/linux-sandbox.ts --arch x64
