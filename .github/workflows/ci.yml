name: CI
on: [push, pull_request]
jobs:
  verify:
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          # tests/forge-build.test.ts imports the last commits of this checkout.
          fetch-depth: 0
      - uses: oven-sh/setup-bun@v2.2.0
        with:
          bun-version: 1.4.2
      - run: bun install --frozen-lockfile
      # website/ has its own lockfile, and the root lint ignores it: the type-aware lint of its
      # sources needs Astro's packages and the types `astro sync` generates (website/.astro,
      # not committed), so it runs here, once they are there.
      - run: bun install --frozen-lockfile && bunx astro sync
        working-directory: website
      - run: bun run lint
        working-directory: website
      - run: bun run probes
      - run: bun run verify
      # The guide quotes the checkout by anchors and indexes every module of packages/core/src:
      # only building the site shows that a change to the code left the guide behind.
      - if: runner.os == 'Linux'
        run: bun run check && bun run build
        working-directory: website
      - run: bun run test:pty
      - run: bun run test:pty:dev
      - run: bun scripts/clean-install.ts
      # The compiled Client in Debian (glibc) and Alpine (musl) containers without Bun.
      - if: runner.os == 'Linux'
        run: bun scripts/linux-client.ts
  # The sandbox mode on Linux (docs/EMBEDDING.md, step 8), in containers, one per
  # mechanism (namespaces, bubblewrap, Landlock alone), plus the launcher's own tests and
  # a check that the committed launcher is what its sources build.
  linux-sandbox:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: oven-sh/setup-bun@v2.2.0
        with:
          bun-version: 1.4.2
      - run: bun install --frozen-lockfile
      - run: bun scripts/build-sandbox.ts --check --arch x64
      - run: bun scripts/linux-sandbox.ts --arch x64
  # What a release would publish, checked on every push: the five publishable packages pack
  # into a tarball a consumer can install and import, no blocking licence sits in their
  # trees, and `bun publish --dry-run` accepts each. Nothing is published here: the dry run
  # stops before the registry, and the placeholder token only gets bun past its "missing
  # authentication" check (it is not a credential). release.yml runs the same gates before
  # its publish job; keep the package lists in step with it (docs/RELEASING.md).
  publishable:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: oven-sh/setup-bun@v2.2.0
        with:
          bun-version: 1.4.2
      - run: bun install --frozen-lockfile
      - run: bun scripts/pack-check.ts packages/core packages/flow-graph packages/markdown-editor packages/create packages/luciole.sh
      - run: bun run licenses
      - name: bun publish --dry-run
        env:
          NPM_CONFIG_TOKEN: dry-run-placeholder
        run: |
          for dir in packages/core packages/flow-graph packages/markdown-editor packages/create packages/luciole.sh; do
            (cd "$dir" && bun publish --dry-run)
          done
