# The layout the framework had before workspaces: one tree at the root. The isolated
# linker (the workspace default) is untested with the single React, OpenTUI Core and
# reconciler that tests/dependencies.test.ts requires.
[install]
linker = "hoisted"

# A thread that fails a test worker whose main thread stopped answering (a synchronous
# call that never returns), instead of letting `bun test --parallel` wait forever.
[test]
preload = ["./tests/watchdog.ts"]
